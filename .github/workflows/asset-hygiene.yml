name: Asset hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  meta-files:
    name: Unity .meta files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Every asset has a .meta and every .meta has an asset
        run: python .github/scripts/check_meta_files.py

  large-files:
    name: Large files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: No added or changed file over the size limit
        run: >
          python .github/scripts/check_large_files.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
          --limit-mb 50
