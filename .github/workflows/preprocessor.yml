name: CSV preprocessor

on:
  pull_request:
    paths:
      - "Assets/Scripts/Data/preprocess_csv_columnar.py"
      - "Assets/StreamingAssets/DataCSV/**"
      - "Tests/Preprocessor/**"
      - ".github/workflows/preprocessor.yml"
  push:
    branches: [main]
    paths:
      - "Assets/Scripts/Data/preprocess_csv_columnar.py"
      - "Assets/StreamingAssets/DataCSV/**"
      - "Tests/Preprocessor/**"
      - ".github/workflows/preprocessor.yml"
  workflow_dispatch:

jobs:
  preprocessor:
    name: Preprocessor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Tests/Preprocessor/requirements.txt
      - run: pip install -r Tests/Preprocessor/requirements.txt
      - name: Fixture regression tests
        run: python Tests/Preprocessor/test_preprocessor.py fixtures
      - name: Committed ProcessedData matches the CSVs
        run: python Tests/Preprocessor/test_preprocessor.py committed
